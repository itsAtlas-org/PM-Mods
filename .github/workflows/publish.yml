name: Publish

# Builds what catalogue.json pins, signs it with the mod-signing key and puts it on this repo's releases.
#
#   plan   (contents: read)   which catalogue entries aren't published yet
#   build  (contents: read)   NO secrets: builds each pending entry from Personal-Manager at its pinned
#                             commit, one matrix job per entry, and uploads the unsigned package
#   sign   (environment mod-signing: Bobby approves, main only; the ONLY job with contents: write and the
#                             ONLY job that sees the two secrets, in ONE step)
#                             recomputes everything about the build output (sha256 against the catalogue,
#                             structure, manifest), signs, uploads, rebuilds and signs index.json, replaces
#                             the assets on release "index", then reads the public URLs back.
#
# The sign job runs no npm and nothing from the Personal-Manager checkout: it uses this repo's
# zero-dependency scripts, the runner's own node and gh. A change to scripts/ or to this file on main runs
# with the key, so review of those diffs is the control.
#
# Triggers: a push to main that changes the catalogue or the blacklist; the monthly re-sign (the index
# expires after 60 days); and a manual run. A manual run with key_check_only decrypts the key, checks it is
# the pinned MAIN key and signs a probe; it uploads nothing. Run that first, and after any workflow change.
#
# Actions are pinned to full commit SHAs (the repo gate enforces it); the trailing "# vX.Y.Z" is the
# version Dependabot reads. Never pull_request_target here.

on:
  push:
    branches: [main]
    paths:
      - catalogue.json
      - blacklist.json
  workflow_dispatch:
    inputs:
      key_check_only:
        description: "Only check the signing key (decrypt it, require the pinned main key, sign and verify a probe); publish nothing"
        type: boolean
        default: false
  schedule:
    - cron: "17 6 1 * *"

permissions: {}

# One publish at a time, and a started one is never cancelled: a half-finished publish is finished by the
# next run (every step is idempotent), but two at once could race on the index seq.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  plan:
    name: Plan
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      pending: ${{ steps.plan.outputs.pending }}
      empty: ${{ steps.plan.outputs.empty }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Which entries are not published yet
        id: plan
        run: node scripts/plan.mjs

  build:
    name: Build ${{ matrix.id }} ${{ matrix.version }}
    needs: plan
    if: ${{ github.ref == 'refs/heads/main' && !inputs.key_check_only && needs.plan.outputs.pending != '[]' }}
    runs-on: ubuntu-24.04
    # No secret exists in this job, and the token cannot write. It runs code from the pinned source commit.
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.pending) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tools
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ matrix.repo }}
          ref: ${{ matrix.commit }}
          path: src
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Build and pack the pinned commit
        env:
          MOD_ID: ${{ matrix.id }}
          MOD_VERSION: ${{ matrix.version }}
          MOD_PATH: ${{ matrix.path }}
          MOD_COMMIT: ${{ matrix.commit }}
          MOD_SHA256: ${{ matrix.unsignedSha256 }}
        run: sh tools/scripts/build-mod.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-${{ matrix.id }}-${{ matrix.version }}
          path: out/${{ matrix.id }}-${{ matrix.version }}.unsigned.pmmod
          retention-days: 3
          if-no-files-found: error

  sign:
    name: Sign and publish
    needs: [plan, build]
    # build is skipped when nothing is pending; it must not have failed. An empty catalogue has nothing to
    # publish, so only the key check runs then.
    if: >-
      ${{ !cancelled() && github.ref == 'refs/heads/main' && needs.plan.result == 'success'
      && (needs.build.result == 'success' || needs.build.result == 'skipped')
      && (inputs.key_check_only || needs.plan.outputs.empty != 'true') }}
    runs-on: ubuntu-24.04
    environment: mod-signing
    permissions:
      contents: write # create the releases and upload their assets; this is the only job that may
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: ${{ needs.build.result == 'success' }}
        with:
          pattern: unsigned-*
          merge-multiple: true
          path: unsigned
      - name: Versions
        run: node --version && gh --version
      # The only step with the secrets. It reads the public release URLs and writes ./signed; it uploads nothing.
      - name: Sign with the mod-signing key
        env:
          ATLAS_MOD_SIGNING_KEY: ${{ secrets.ATLAS_MOD_SIGNING_KEY }}
          ATLAS_MOD_SIGNING_KEY_PASSWORD: ${{ secrets.ATLAS_MOD_SIGNING_KEY_PASSWORD }}
          KEY_CHECK_ONLY: ${{ inputs.key_check_only }}
        run: |
          if [ "$KEY_CHECK_ONLY" = "true" ]; then
            node scripts/sign.mjs --key-check-only
          else
            mkdir -p unsigned
            node scripts/sign.mjs --unsigned unsigned --out signed
          fi
      - name: Create the releases and replace the index
        if: ${{ !inputs.key_check_only }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish.mjs signed
      - name: Read the public URLs back
        if: ${{ !inputs.key_check_only }}
        run: node scripts/verify-published.mjs --plan signed/plan.json
