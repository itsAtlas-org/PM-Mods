name: Publish

# Builds what catalogue.json pins, signs it with the mod-signing key and puts it on this repo's releases.
#
#   plan   (contents: read)   which catalogue entries aren't published yet
#   build  (contents: read)   NO secrets: builds each pending entry from Personal-Manager at its pinned
#                             commit, one matrix job per entry, and uploads the unsigned package
#   sign   (environment mod-signing: Bobby approves, main only; the ONLY job with contents: write and the
#                             ONLY job that sees the two secrets, in ONE step)
#                             reads the live index through the API, recomputes everything about the build
#                             output (sha256 against the catalogue, structure, manifest), signs, keeps the
#                             new index pair as an artifact, uploads, rebuilds and signs index.json,
#                             replaces the assets on release "index", then reads the public URLs back.
#
# The sign job runs no npm and nothing from the Personal-Manager checkout: it uses this repo's
# zero-dependency scripts, the runner's own node and gh. A change to scripts/ or to this file on main runs
# with the key, so review of those diffs is the control. The build artifacts are extracted OUTSIDE the
# checkout ($RUNNER_TEMP/unsigned), so they can never sit next to the scripts that hold the key, and
# sign.mjs reads only regular files with the catalogue's names from there.
#
# The sign job also runs when some builds FAILED (the run is red regardless): it then signs what is built
# and leaves the unbuilt entries out, so one entry that can't be built never stops the monthly renewal
# of the index or an emergency blacklist. What to do after a red run: README, "A run failed".
#
# Triggers: a push to main that changes the catalogue or the blacklist; the monthly re-sign (the index
# expires after 60 days); and a manual run. A manual run with key_check_only decrypts the key, checks it is
# the pinned MAIN key and signs a probe; it uploads nothing. Run that first, and after any workflow change.
#
# Actions are pinned to full commit SHAs (the repo gate enforces it); the trailing "# vX.Y.Z" is the
# version Dependabot reads. Never pull_request_target here.

on:
  push:
    branches: [main]
    paths:
      - catalogue.json
      - blacklist.json
  workflow_dispatch:
    inputs:
      key_check_only:
        description: "Only check the signing key (decrypt it, require the pinned main key, sign and verify a probe); publish nothing"
        type: boolean
        default: false
  schedule:
    - cron: "17 6 1 * *"

permissions: {}

# One publish at a time, and a started one is never cancelled (two at once could race on the index seq).
# GitHub keeps one PENDING run per group and cancels an older pending one for a newer, so a key check
# (which publishes nothing) has its own group: it must not push a queued publish out of the line.
concurrency:
  group: publish${{ inputs.key_check_only && '-keycheck' || '' }}
  cancel-in-progress: false

jobs:
  plan:
    name: Plan
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      pending: ${{ steps.plan.outputs.pending }}
      empty: ${{ steps.plan.outputs.empty }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Which entries are not published yet
        id: plan
        run: node scripts/plan.mjs

  build:
    name: Build ${{ matrix.id }} ${{ matrix.version }}
    needs: plan
    if: ${{ github.ref == 'refs/heads/main' && !inputs.key_check_only && needs.plan.outputs.pending != '[]' }}
    runs-on: ubuntu-24.04
    # No secret exists in this job, and the token cannot write. It runs code from the pinned source commit.
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.pending) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tools
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ matrix.repo }}
          ref: ${{ matrix.commit }}
          path: src
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Build and pack the pinned commit
        env:
          MOD_ID: ${{ matrix.id }}
          MOD_VERSION: ${{ matrix.version }}
          MOD_PATH: ${{ matrix.path }}
          MOD_COMMIT: ${{ matrix.commit }}
          MOD_SHA256: ${{ matrix.unsignedSha256 }}
        run: sh tools/scripts/build-mod.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-${{ matrix.id }}-${{ matrix.version }}
          path: out/${{ matrix.id }}-${{ matrix.version }}.unsigned.pmmod
          retention-days: 3
          if-no-files-found: error

  sign:
    name: Sign and publish
    needs: [plan, build]
    # build is skipped when nothing is pending, and may have FAILED for some entries: the sign step then
    # leaves those out (--allow-unbuilt) and the run stays red. An empty catalogue has nothing to publish,
    # so only the key check runs then.
    if: >-
      ${{ !cancelled() && github.ref == 'refs/heads/main' && needs.plan.result == 'success'
      && (needs.build.result == 'success' || needs.build.result == 'skipped' || needs.build.result == 'failure')
      && (inputs.key_check_only || needs.plan.outputs.empty != 'true') }}
    runs-on: ubuntu-24.04
    environment: mod-signing
    permissions:
      contents: write # create the releases and upload their assets; this is the only job that may
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Outside the checkout: whatever a build job puts in these artifacts can't land next to scripts/.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: ${{ !inputs.key_check_only && needs.build.result != 'skipped' }}
        # When every build failed there is nothing to download, and that must not stop the sign job.
        continue-on-error: ${{ needs.build.result == 'failure' }}
        with:
          pattern: unsigned-*
          merge-multiple: true
          path: ${{ runner.temp }}/unsigned
      - name: Versions
        run: node --version && gh --version
      # Reads the live index pair through the API (not the CDN) for the next seq. Has the token, no key.
      - name: Read the live index
        if: ${{ !inputs.key_check_only }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/live-index.mjs "$RUNNER_TEMP/live"
      # The key signs main's TIP and nothing older. The ref-name guards (github.ref, the environment's main-only
      # rule) say nothing about the commit, so "Re-run jobs" on an old run, or an old run that was waiting for
      # approval while a newer commit merged, would sign that old commit's scripts, catalogue and blacklist
      # and replace the live index with them: a rolled-back emergency blacklist. Runs for key checks too.
      # Token only, no secret; if main moved on after this check, the newer commit's own run follows.
      - name: Refuse a commit that is not the tip of main
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_SHA: ${{ github.sha }}
        run: |
          tip=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [ "$tip" != "$RUN_SHA" ]; then
            echo "::error::This run is for $RUN_SHA but main is now at $tip. Nothing was signed. Run Publish again from main (Actions, Publish, Run workflow); do not re-run this one."
            exit 1
          fi
      # The only step with the secrets. It reads the public release URLs and writes ./signed; it uploads nothing.
      - name: Sign with the mod-signing key
        env:
          ATLAS_MOD_SIGNING_KEY: ${{ secrets.ATLAS_MOD_SIGNING_KEY }}
          ATLAS_MOD_SIGNING_KEY_PASSWORD: ${{ secrets.ATLAS_MOD_SIGNING_KEY_PASSWORD }}
          KEY_CHECK_ONLY: ${{ inputs.key_check_only }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          if [ "$KEY_CHECK_ONLY" = "true" ]; then
            node scripts/sign.mjs --key-check-only
          elif [ "$BUILD_RESULT" = "failure" ]; then
            node scripts/sign.mjs --unsigned "$RUNNER_TEMP/unsigned" --live "$RUNNER_TEMP/live" --out signed --allow-unbuilt
          else
            node scripts/sign.mjs --unsigned "$RUNNER_TEMP/unsigned" --live "$RUNNER_TEMP/live" --out signed
          fi
      # The pair about to replace the live one, kept BEFORE the replacement: replacing the two assets is not
      # atomic, and if it tears this is how the pair is put back (README, "A run failed"). No secret in it.
      # overwrite: true, because a re-run of the failed jobs is the documented recovery and artifacts belong to
      # the RUN, not the attempt: without it the second attempt's upload fails and publish.mjs never runs. A
      # torn live index makes sign refuse before this step, so the earlier attempt's pair is never overwritten
      # while it is the one to restore.
      - name: Keep the signed index pair
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !inputs.key_check_only }}
        with:
          name: signed-index
          overwrite: true
          path: |
            signed/index.json
            signed/index.json.minisig
            signed/plan.json
          retention-days: 30
          if-no-files-found: error
      - name: Create the releases and replace the index
        if: ${{ !inputs.key_check_only }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish.mjs signed
      - name: Read the public URLs back
        if: ${{ !inputs.key_check_only }}
        run: node scripts/verify-published.mjs --plan signed/plan.json
